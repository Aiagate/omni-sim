[package]
name = "deep-juno"
version = "0.1.0"
edition = "2021"
description = "Tick-based civilization simulation powered by Bevy ECS"

[dependencies]
bevy = "0.15"
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
rand = "0.8"
rand_chacha = "0.3"
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
