[pytest]
# pytestの設定ファイル

# テストディレクトリ
testpaths = tests

# Python ファイルの検索パターン
python_files = test_*.py

# テストクラスの検索パターン
python_classes = Test*

# テスト関数の検索パターン
python_functions = test_*

# 出力設定
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# カスタムマーカー
markers =
    unit: 単体テスト（個別クラス・関数のテスト）
    integration: 統合テスト（複数コンポーネントの連携テスト）
    slow: 実行時間が長いテスト

# カバレッジ設定
[coverage:run]
source = src
omit =
    tests/*
    src/__init__.py
    src/*/__init__.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
